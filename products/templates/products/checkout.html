<!DOCTYPE html>
<html>

<head>

    <title>Checkout</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        header {
            background-color: #222;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .checkout {
            width: 90%;
            max-width: 700px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.15);
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        textarea {
            height: 100px;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: green;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .total {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 25px;
        }

    </style>

</head>


<body>

<header>

    <h1>🛒 Checkout</h1>

</header>


<div class="checkout">

    <h2>Order Summary</h2>

    {% for item in cart_items %}

        <p>
            {{ item.product.name }}
            × {{ item.quantity }}
            — ₹{{ item.item_total }}
        </p>

    {% endfor %}

    <p class="total">
        Total: ₹{{ total }}
    </p>


    <h2>Customer Details</h2>

    <form method="POST">

        {% csrf_token %}

        <label>Name</label>

        <input
            type="text"
            name="name"
            placeholder="Enter your name"
            required
        >


        <label>Email</label>

        <input
            type="email"
            name="email"
            placeholder="Enter your email"
            required
        >


        <label>Address</label>

        <textarea
            name="address"
            placeholder="Enter your delivery address"
            required
        ></textarea>


        <button type="submit">
            Place Order
        </button>

    </form>

</div>

</body>

</html>
